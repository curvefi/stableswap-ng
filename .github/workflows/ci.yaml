name: CI

on: [push]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup Python 3.10.4
        run: uv python install 3.10.4

      - name: Run pre-commit
        run: uv run --group dev --frozen pre-commit run --all-files

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        name:
          - token
          - gauge
          - pools/exchange
          - pools/general
          - pools/liquidity
          - pools/meta
          - pools/oracle
          - factory

    steps:
      - uses: actions/checkout@v7

      - name: Cache Compiler Installations
        uses: actions/cache@v6
        with:
          path: ~/.vvm
          key: compiler-cache

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.3"
          enable-cache: true
          cache-dependency-glob: requirements-tests.txt

      - name: Setup Python 3.10.4
        run: uv python install 3.10.4

      - name: Run Tests
        env:
          WEB3_PROVIDER_URL: ${{ secrets.WEB3_PROVIDER_URL }}
        run: |
          if [[ ${{ matrix.name }} == "pools/oracle" ]]; then
            uv run --python 3.10.4 --no-project --with-requirements requirements-tests.txt pytest --numprocesses=auto --dist=loadscope tests/${{ matrix.name }}/
          else
            uv run --python 3.10.4 --no-project --with-requirements requirements-tests.txt pytest --numprocesses=auto tests/${{ matrix.name }}/
          fi
